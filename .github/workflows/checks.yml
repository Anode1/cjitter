# Every check this project has, on every push, on two platforms.
#
# No branch filter, deliberately. A `branches: [main]` copied into a repository whose branch is
# `master` produces a workflow that never runs once while the README claims it does.
#
# macOS is here because clang's libm is not glibc's, and the determinism claim should meet
# a second libm early.
name: checks

on: [push, pull_request, workflow_dispatch]

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make && test -x ./labels && test -x ./erd
      - name: library and staged install
        run: make lib && make install DESTDIR=$PWD/stage PREFIX=/usr && test -f stage/usr/lib/libcjitter.a && test -f stage/usr/include/cjitter.h
      - name: unit suite
        run: make ut
      - name: black-box suite
        run: make cliut
      - name: pedantic, every source in the tree
        run: make pedantic
      - name: AddressSanitizer
        run: make ut-asan
      - name: UndefinedBehaviorSanitizer
        run: make ut-ubsan

  compilers:
    # The cheapest job here. In bpnn this matrix would have caught on day one two defects that
    # the author's single compiler never showed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-12, gcc-13, clang]
        opt: ["-O0", "-O2"]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: install ${{ matrix.cc }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cc }}
      - name: build and check at ${{ matrix.opt }}
        run: make CFLAGS="${{ matrix.opt }}" && make CFLAGS="${{ matrix.opt }}" check
      - name: pedantic
        run: make pedantic

  reproducible:
    # The README claims a run reproduces from its seed on another compiler; -ffp-contract=off
    # exists for exactly this. Two compilers, two optimisation levels, one output -- and
    # -march=native is in the matrix because it is the flag that exposes FMA contraction.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: run both examples four ways
        run: |
          set -e
          for spec in "cc -O0" "cc -O2 -march=native" "clang -O0" "clang -O2 -march=native"; do
            set -- $spec; comp=$1; shift
            make clean >/dev/null
            make CC="$comp" CFLAGS="$*" >/dev/null
            ./labels 40 4000 3 > "l-$comp$1.txt"
            ./erd > "e-$comp$1.txt"
          done
          for prefix in l e; do
            first=$(ls $prefix-*.txt | head -1)
            for f in $prefix-*.txt; do
              cmp "$first" "$f" || { echo "OUTPUTS DIFFER: $first vs $f"; exit 1; }
            done
          done
          echo "every build produced the same output"
